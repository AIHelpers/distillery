[project]
name = "distillery-trainer"
version = "0.1.0"
description = "Local QLoRA fine-tuning worker for Distillery"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.9.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.29.0",
    "datasets>=2.18.0",
    "evaluate>=0.4.2",
    "sacrebleu>=2.4.0",
    "huggingface_hub>=0.23.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.3",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "optimum>=1.17.0",
    "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
# Pure-Python GGUF — no native compilation required (primary path).
gguf = [
    "gguf>=0.10.0",
]
# Tabular ML (plan 08). numpy alone works (pure-numpy booster); the GBM
# libraries are used when installed. pandas is needed by CatBoost only.
tabular = [
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "pandas>=2.0.0",
]
# Optional statistical / pretrained forecasters (large downloads; Chronos
# is untested in CI).
forecast = [
    "statsforecast>=1.7.0",
]

# Optional fallback: llama-cpp-python (requires native C++ compilation).
gguf-native = [
    "llama-cpp-python>=0.2.5",
    "torchao>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["trainer*"]

[tool.pytest.ini_options]
testpaths = ["trainer/tests"]