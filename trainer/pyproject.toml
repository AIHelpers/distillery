[project]
name = "distillery-trainer"
version = "0.1.0"
description = "Local QLoRA fine-tuning worker for Distillery"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "peft>=0.9.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.29.0",
    "datasets>=2.18.0",
    "evaluate>=0.4.2",
    "sacrebleu>=2.4.0",
    "huggingface_hub>=0.23.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.3",
]

[project.optional-dependencies]
gguf = [
    "llama-cpp-python>=0.2.0",
    "torchao>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["trainer*"]

[tool.pytest.ini_options]
testpaths = ["trainer/tests"]